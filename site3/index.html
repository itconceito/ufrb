<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claquete: catálogo de filmes e séries</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="topbar">
    <a class="brand" href="index.html">claquete</a>
    <nav aria-label="Principal">
      <a href="index.html" aria-current="page">Descobrir</a>
      <a href="favoritos.html">Favoritos <span id="fav-count" class="badge">0</span></a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>O que vamos assistir hoje?</h1>
      <form id="search-form" class="search" role="search">
        <input id="search-input" type="search" placeholder="Busque um filme ou série pelo título" aria-label="Buscar título" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
      <div class="filters">
        <div class="segmented" role="group" aria-label="Tipo de título">
          <button type="button" data-type="movie" class="active" aria-pressed="true">Filmes</button>
          <button type="button" data-type="tv" aria-pressed="false">Séries</button>
        </div>
        <label class="select">Gênero
          <select id="genre-select"><option value="">Todos</option></select>
        </label>
      </div>
    </section>

    <section id="key-banner" class="banner" hidden>
      <form id="key-form">
        <label for="key-input">Chave da API do TMDB</label>
        <p>Cole sua chave (v3) ou token (v4). Ela fica salva só neste navegador.</p>
        <div class="search">
          <input id="key-input" type="password" required autocomplete="off">
          <button type="submit">Salvar chave</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="spinner" class="spinner" role="progressbar" aria-label="Carregando" hidden></div>
    <ul id="grid" class="grid"></ul>

    <nav id="pagination" class="pagination" aria-label="Paginação" hidden>
      <button id="prev" type="button">Anterior</button>
      <span id="page-info"></span>
      <button id="next" type="button">Próxima</button>
    </nav>
  </main>

  <dialog id="modal" aria-label="Detalhes do título"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
